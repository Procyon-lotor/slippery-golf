<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Golf</title>

<style>

body{
    margin:0;
    background:#222;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#menu{
    padding-top:50px;
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
}

#gameContainer{
    display:none;
    width:max-content;
    margin:0 auto;
    padding-left:120px;
    padding-right:120px;
    box-sizing:content-box;
}

canvas{
    display:block;
    margin:20px 0;
    background:#2f9e44;
    border:4px solid white;
}

#topBar{
    margin-top:15px;
    font-size:24px;
}

#selectBallButton{
    position:fixed;
    top:15px;
    left:15px;
    margin:0;
    z-index:1000;
}

#ballModal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    z-index:2000;
    align-items:center;
    justify-content:center;
}

#ballModalContent{
    position:relative;
    width:650px;
    max-width:90%;
    padding:30px;
    background:#333;
    border:3px solid white;
    border-radius:12px;
    box-sizing:border-box;
}

#ballModalContent h2{
    margin-top:0;
    font-size:30px;
}

#closeBallModal{
    position:absolute;
    top:5px;
    right:5px;
    margin:0;
    padding:5px 12px;
    font-size:25px;
}

#ballOptions{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(2, auto);
    gap:15px;
}

.ball-option{
    padding:15px 5px;
    margin:0;
    min-height:150px;
    background:#444;
    border:2px solid #777;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.ball-option:hover{
    background:#555;
}

.ball-option.selected{
    border:4px solid #6f9fbf;
}

.ball-option.locked{
    opacity:0.45;
    cursor:not-allowed;
}

.ball-preview{
    width:50px;
    height:50px;
    margin:5px auto 15px;
    border-radius:50%;
    border:2px solid white;
}

.ball-name{
    font-size:18px;
    font-weight:bold;
}

.ball-unlock{
    margin-top:8px;
    font-size:14px;
}

.ball-effect{
    margin-top:8px;
    font-size:13px;
}

#xpContainer{
    position:fixed;
    top:15px;
    right:15px;
    width:250px;
    z-index:1000;
}

#xpLevel{
    font-size:18px;
    font-weight:bold;
    text-align:right;
    margin-bottom:5px;
}

#xpBar{
    position:relative;
    width:250px;
    height:25px;
    background:#444;
    border:2px solid white;
    border-radius:12px;
    overflow:hidden;
}

#xpFill{
    width:0%;
    height:100%;
    background:#6f9fbf;
    transition:width 0.3s;
}

#xpText{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:bold;
}

#winScreen{
    display:none;
    margin-top:15px;
}

#editorContainer{
    display:none;
}

#editorCanvas{
    display:block;
    margin:20px auto;
    background:#2f9e44;
    border:4px solid white;
}

#levelJSON{
    display:block;
    margin:20px auto;
    width:800px;
    font-family:monospace;
    font-size:14px;
}

#editorControls{
    margin:10px;
}

#courseDimensions{
    margin:15px;
}

#courseDimensions label{
    margin:10px;
}

#courseDimensions input{
    width:80px;
    font-size:16px;
}

#editorControls label{
    margin-left:20px;
}

#editorCanvas{
    display:block;
    margin:20px auto;
    background:#2f9e44;
    border:4px solid white;
    cursor:crosshair;
}

.editor-mode-button{
    background-color: #ddd;
    color: #222;
    border: 2px solid #aaa;
}

.editor-mode-button:hover{
    background-color: #eee;
}

.editor-mode-button.active{
    background-color: #6f9fbf;
    color: white;
    border-color: #4f7f9f;
}

#objectType{
    margin-left:10px;
    padding:5px;
}

#levelButtons{
    margin:30px auto;
    width:fit-content;
}

.scorecard{
    border-collapse:collapse;
    background:#f2f7f3;
    color:#222;
    font-size:20px;
    border:2px solid #4f7f5f;
    border-radius:8px;
    overflow:hidden;
}

.scorecard th,
.scorecard td{
    border:1px solid #9caf9f;
    padding:12px 20px;
    min-width:70px;
    text-align:center;
}

.scorecard th{
    background:#dce9df;
    color:#214d31;
    font-weight:bold;
}

.scorecard .row-label{
    background:#e5eee7;
    color:#214d31;
    font-weight:bold;
}

.scorecard button{
    margin:0;
    padding:0;
    width:100%;
    border:none;
    background:transparent;
    color:#214d31;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.scorecard button:hover{
    background:#d5e6d9;
}

.medal-gold{
    background:#ffd700 !important;
    color:#222;
    font-weight:bold;
}

.medal-silver{
    background:#c0c0c0 !important;
    color:#222;
    font-weight:bold;
}

.medal-bronze{
    background:#cd7f32 !important;
    color:white;
    font-weight:bold;
}

.medal-earned{
    font-size:24px;
    font-weight:bold;
    display:inline-block;
}

.new-high-score{
    font-size:24px;
    font-weight:bold;
    color:#ff1493;
    display:inline-block;
    margin-left:15px;
}

.result-messages{
    margin:15px 0;
}

</style>
</head>
<body>

<div id="menu">

    <h1>Mini Golf</h1>

    <h2>Select Level</h2>

    <div id="levelButtons"></div>

</div>

<div id="xpContainer">

    <div id="xpLevel">
        Level 1
    </div>

    <div id="xpBar">
        <div id="xpFill"></div>
        <span id="xpText">
            0 / 100 XP
        </span>
    </div>

</div>

<div id="gameContainer">

    <div id="topBar">

        Strokes:
        <span id="strokeCount">0</span>
    
        &nbsp;|&nbsp;
    
        Gold:
        <span id="goldScore">0</span>
    
        &nbsp;|&nbsp;
    
        Silver:
        <span id="silverScore">0</span>
    
        &nbsp;|&nbsp;
    
        Bronze:
        <span id="bronzeScore">0</span>
    
    </div>

    <button
    id="selectBallButton"
    onclick="openBallModal()"
>
    Select Ball
</button>

<button onclick="backToMenu()">
    Menu
</button>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="winScreen"></div>

</div>

<div id="ballModal">

    <div id="ballModalContent">

        <button
            id="closeBallModal"
            onclick="closeBallModal()"
        >
            ×
        </button>

        <h2>Select Ball</h2>

        <div id="ballOptions"></div>

    </div>

</div>

<div id="editorContainer">

    <h1>Level Editor</h1>

    <p>
        Click and drag to create walls.
        Click "Set Start" or "Set Hole" to place those objects.
    </p>

    <div id="editorControls">
    
        <button
        id="addObjectButton"
        class="editor-mode-button active"
        onclick="editorSetMode('object')"
    >
        Add Object
    </button>
    
    <button
        id="deleteObjectButton"
        class="editor-mode-button"
        onclick="editorSetMode('delete')"
    >
        Delete Object
    </button>
    
    <select id="objectType">
        <option value="wall">Wall</option>
        <option value="bouncy">Bouncy Wall</option>
        <option value="fire">Fire Wall</option>
        <option value="ice">Ice</option>
    </select>

<button
    id="setStartButton"
    class="editor-mode-button"
    onclick="editorSetMode('start')"
>
    Set Start
</button>

<button
    id="setHoleButton"
    class="editor-mode-button"
    onclick="editorSetMode('hole')"
>
    Set Hole
</button>

<button onclick="exportLevel()">
    Export JSON
</button>
    
        <label>
            Show Grid
            <input
                type="checkbox"
                id="showGrid"
                checked
                onchange="drawEditor()"
            >
        </label>
    
    </div>
    
    <div id="courseDimensions">
    
        <label>
            Course Width:
            <input
                type="number"
                id="courseWidth"
                value="900"
                min="60"
                step="30"
                onchange="changeCourseDimensions()"
            >
        </label>
    
        <label>
            Course Height:
            <input
                type="number"
                id="courseHeight"
                value="480"
                min="60"
                step="30"
                onchange="changeCourseDimensions()"
            >
        </label>
    
    </div>

    <canvas
        id="editorCanvas"
        width="900"
        height="480">
    </canvas>

    <textarea
        id="levelJSON"
        rows="15"
        cols="80"
        placeholder="Your exported level JSON will appear here...">
    </textarea>

</div>

function createLevelButtons(){

const container =
    document.getElementById("levelButtons");

container.innerHTML = "";

const table =
    document.createElement("table");

table.className = "scorecard";

// =====================
// HOLE NUMBER ROW
// =====================

const holeRow =
    document.createElement("tr");

const holeLabel =
    document.createElement("th");

holeLabel.textContent = "Hole";

holeRow.appendChild(holeLabel);

levels.forEach((level, index) => {

    const cell =
        document.createElement("th");

    const button =
        document.createElement("button");

    button.textContent =
        level.id;

    button.onclick = () => {
        startLevel(index);
    };

    cell.appendChild(button);
    holeRow.appendChild(cell);
});

table.appendChild(holeRow);

// =====================
// BEST SCORE ROW
// =====================

const scoreRow =
    document.createElement("tr");

const scoreLabel =
    document.createElement("td");

scoreLabel.className = "row-label";
scoreLabel.textContent = "Best";

scoreRow.appendChild(scoreLabel);

levels.forEach(level => {

    const cell =
        document.createElement("td");

    const best =
        bestScores[level.id];

    if(best === undefined){

        cell.textContent = "—";

    }else{

        cell.textContent = best;

        const medal =
            getMedal(level, best);

        if(medal === "gold"){
            cell.classList.add("medal-gold");
        }

        if(medal === "silver"){
            cell.classList.add("medal-silver");
        }

        if(medal === "bronze"){
            cell.classList.add("medal-bronze");
        }
    }

    scoreRow.appendChild(cell);
});

table.appendChild(scoreRow);

function getMedal(level, score){

const scores =
    medalScores[level.id];

if(!scores){
    return "";
}


const bonus =
    selectedBall === "black"
    ? 1
    : 0;


if(
    score <= scores[0] + bonus
){
    return "gold";
}


if(
    score <= scores[1] + bonus
){
    return "silver";
}


if(
    score <= scores[2] + bonus
){
    return "bronze";
}


return "";
}

function getXPRequired(){

return 100 *
    Math.pow(
        1.1,
        playerLevel - 1
    );

}


function updateXPDisplay(){

const xpRequired =
    getXPRequired();

const percentage =
    (playerXP / xpRequired) * 100;

document.getElementById(
    "xpLevel"
).textContent =
    `Level ${playerLevel}`;

document.getElementById(
    "xpFill"
).style.width =
    `${Math.min(percentage,100)}%`;

document.getElementById(
    "xpText"
).textContent =
    `${Math.floor(playerXP)} / ${Math.ceil(xpRequired)} XP`;

}


function saveXP(){

localStorage.setItem(
    "playerLevel",
    playerLevel
);

localStorage.setItem(
    "playerXP",
    playerXP
);

localStorage.setItem(
    "earnedMedals",
    JSON.stringify(earnedMedals)
);

}


function awardMedalXP(level, medal){

if(!medal)
    return;


const levelID =
    level.id;


// Create the medal list for this level
if(!earnedMedals[levelID]){
    earnedMedals[levelID] = [];
}


// Do not award XP for the same medal twice
if(
    earnedMedals[levelID].includes(medal)
){
    return;
}


const xpRewards = {

    bronze: 25,
    silver: 50,
    gold: 100

};


const reward =
    xpRewards[medal];


if(!reward)
    return;


playerXP += reward;


earnedMedals[levelID].push(medal);


// Handle level-ups
while(
    playerXP >= getXPRequired()
){

    playerXP -= getXPRequired();

    playerLevel++;

}

createBallOptions();
saveXP();
updateXPDisplay();

}

function collideWall(wall){

const left = wall.x;
const right = wall.x + wall.width;
const top = wall.y;
const bottom = wall.y + wall.height;


// =====================
// NEIGHBORS
// =====================

const hasLeftNeighbor =
    wallPositions.has(
        `${left - GRID_SIZE},${top}`
    );

const hasRightNeighbor =
    wallPositions.has(
        `${right},${top}`
    );

const hasTopNeighbor =
    wallPositions.has(
        `${left},${top - GRID_SIZE}`
    );

const hasBottomNeighbor =
    wallPositions.has(
        `${left},${bottom}`
    );


// =====================
// LEFT EDGE
// =====================

if(
    !hasLeftNeighbor &&
    ball.x + ball.radius > left &&
    ball.x < left &&
    ball.y >= top &&
    ball.y <= bottom
){

    ball.x = left - ball.radius;

    if(ball.vx > 0){
        ball.vx *= -0.9;
    }

    return;
}


// =====================
// RIGHT EDGE
// =====================

if(
    !hasRightNeighbor &&
    ball.x - ball.radius < right &&
    ball.x > right &&
    ball.y >= top &&
    ball.y <= bottom
){

    ball.x = right + ball.radius;

    if(ball.vx < 0){
        ball.vx *= -0.9;
    }

    return;
}


// =====================
// TOP EDGE
// =====================

if(
    !hasTopNeighbor &&
    ball.y + ball.radius > top &&
    ball.y < top &&
    ball.x >= left &&
    ball.x <= right
){

    ball.y = top - ball.radius;

    if(ball.vy > 0){
        ball.vy *= -0.9;
    }

    return;
}


// =====================
// BOTTOM EDGE
// =====================

if(
    !hasBottomNeighbor &&
    ball.y - ball.radius < bottom &&
    ball.y > bottom &&
    ball.x >= left &&
    ball.x <= right
){

    ball.y = bottom + ball.radius;

    if(ball.vy < 0){
        ball.vy *= -0.9;
    }

    return;
}

// =====================
// CORNERS

function collideCorner(
    cornerX,
    cornerY,
    horizontalExposed,
    verticalExposed
){

    // Only treat this as a corner if BOTH
    // edges meeting here are exposed.
    //
    // This prevents the shared corners between
    // connected wall tiles from producing weird
    // angled bounces.

    if(
        !horizontalExposed ||
        !verticalExposed
    ){
        return false;
    }


    const dx =
        ball.x - cornerX;

    const dy =
        ball.y - cornerY;

    const distance =
        Math.hypot(dx,dy);


    if(distance >= ball.radius)
        return false;


    // Avoid division by zero
    if(distance < 0.0001)
        return false;


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    // Push the ball outside the corner
    const overlap =
        ball.radius - distance;

    ball.x += nx * overlap;
    ball.y += ny * overlap;


    // Reflect velocity away from corner
    const dot =
        ball.vx * nx +
        ball.vy * ny;

    if(dot < 0){

        ball.vx =
            ball.vx -
            2 * dot * nx;

        ball.vy =
            ball.vy -
            2 * dot * ny;

        ball.vx *= 0.9;
        ball.vy *= 0.9;

    }

    return true;
}


// Top-left corner
if(collideCorner(
    left,
    top,
    !hasTopNeighbor,
    !hasLeftNeighbor
)){
    return;
}


// Top-right corner
if(collideCorner(
    right,
    top,
    !hasTopNeighbor,
    !hasRightNeighbor
)){
    return;
}


// Bottom-left corner
if(collideCorner(
    left,
    bottom,
    !hasBottomNeighbor,
    !hasLeftNeighbor
)){
    return;
}


// Bottom-right corner
if(collideCorner(
    right,
    bottom,
    !hasBottomNeighbor,
    !hasRightNeighbor
)){
    return;
}

}

    }

    if(ball.x + ball.radius > canvas.width){

        ball.x = canvas.width - ball.radius;
        ball.vx *= -1;
    }

    if(ball.y - ball.radius < 0){

        ball.y = ball.radius;
        ball.vy *= -1;
    }

    if(ball.y + ball.radius > canvas.height){

        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
    }

    // Hole logic

    const dx = hole.x - ball.x;
    const dy = hole.y - ball.y;

    const dist = Math.hypot(dx,dy);

    // Ball center must cross over cup

    if(
        dist < hole.radius &&
        speed < 5
    ){

        sinking = true;

        ball.vx = 0;
        ball.vy = 0;
    }
}

// =========================
// LEVEL EDITOR
// =========================

const editorCanvas =
    document.getElementById("editorCanvas");

const editorCtx =
    editorCanvas.getContext("2d");

const GRID_SIZE = 30;

let editorMode = "object";

let editorWalls = [];
let editorBouncyWalls = [];
let editorFireWalls = [];
let editorIce = [];

let editorDragging = false;

let editorMouseX = 0;
let editorMouseY = 0;

let editorStart = {
    x:105,
    y:315
};

let editorHole = {
    x:855,
    y:315
};

function snapToGrid(value){

return Math.round(
    value / GRID_SIZE
) * GRID_SIZE;
}

function snapCenterToGrid(value){

return Math.floor(
    value / GRID_SIZE
) * GRID_SIZE + GRID_SIZE / 2;
}

function editorSetMode(mode){

editorMode = mode;

editorDragging = false;

document
    .querySelectorAll(".editor-mode-button")
    .forEach(button => {
        button.classList.remove("active");
    });

if(mode === "object"){

    document
        .getElementById("addObjectButton")
        .classList.add("active");

}

if(mode === "delete"){

    document
        .getElementById("deleteObjectButton")
        .classList.add("active");

}

if(mode === "start"){

    document
        .getElementById("setStartButton")
        .classList.add("active");

}

if(mode === "hole"){

    document
        .getElementById("setHoleButton")
        .classList.add("active");

}

drawEditor();
}

function changeCourseDimensions(){

let width =
    Number(
        document.getElementById("courseWidth").value
    );

let height =
    Number(
        document.getElementById("courseHeight").value
    );

width = Math.max(
    GRID_SIZE,
    Math.round(width / GRID_SIZE) * GRID_SIZE
);

height = Math.max(
    GRID_SIZE,
    Math.round(height / GRID_SIZE) * GRID_SIZE
);

document.getElementById("courseWidth").value =
    width;

document.getElementById("courseHeight").value =
    height;

editorCanvas.width = width;
editorCanvas.height = height;

drawEditor();
}

editorCanvas.addEventListener("mousedown", e => {

const rect =
    editorCanvas.getBoundingClientRect();

const x =
    e.clientX - rect.left;

const y =
    e.clientY - rect.top;

editorMouseX = x;
editorMouseY = y;

// -------------------------
// START MODE
// -------------------------

if(editorMode === "start"){

    editorStart.x =
        snapCenterToGrid(x);

    editorStart.y =
        snapCenterToGrid(y);

    drawEditor();

    return;
}

// -------------------------
// HOLE MODE
// -------------------------

if(editorMode === "hole"){

    editorHole.x =
        snapCenterToGrid(x);

    editorHole.y =
        snapCenterToGrid(y);

    drawEditor();

    return;
}

// OBJECT PAINTING

if(editorMode === "object"){

editorDragging = true;

paintObjectSquare(x, y);

return;
}

// OBJECT DELETING

if(editorMode === "delete"){

editorDragging = true;

deleteObjectSquare(x, y);

return;
}

});

window.addEventListener("mousemove", e => {

if(!editorDragging)
    return;

const rect =
    editorCanvas.getBoundingClientRect();

editorMouseX =
    e.clientX - rect.left;

editorMouseY =
    e.clientY - rect.top;

// Continue painting/erasing

if(editorMode === "object"){

paintObjectSquare(
    editorMouseX,
    editorMouseY
);

}

if(editorMode === "delete"){

deleteObjectSquare(
    editorMouseX,
    editorMouseY
);

}

});


window.addEventListener("mouseup", () => {

editorDragging = false;

});
function paintObjectSquare(x, y){

const gridX =
    Math.floor(x / GRID_SIZE) * GRID_SIZE;

const gridY =
    Math.floor(y / GRID_SIZE) * GRID_SIZE;

const objectType =
    document.getElementById("objectType").value;

// =========================
// WALL
// =========================

if(objectType === "wall"){

    const alreadyExists =
        editorWalls.some(object =>
            object.x === gridX &&
            object.y === gridY
        );

    if(!alreadyExists){

        editorWalls.push({
            x:gridX,
            y:gridY,
            width:GRID_SIZE,
            height:GRID_SIZE
        });

    }

}

// =========================
// BOUNCY WALL
// =========================

if(objectType === "bouncy"){

const alreadyExists =
    editorBouncyWalls.some(object =>
        object.x === gridX &&
        object.y === gridY
    );

if(!alreadyExists){

    editorBouncyWalls.push({
        x:gridX,
        y:gridY,
        width:GRID_SIZE,
        height:GRID_SIZE
    });

}

}

// =========================
// FIRE WALL
// =========================

if(objectType === "fire"){

    const alreadyExists =
        editorFireWalls.some(object =>
            object.x === gridX &&
            object.y === gridY
        );

    if(!alreadyExists){

        editorFireWalls.push({
            x:gridX,
            y:gridY,
            width:GRID_SIZE,
            height:GRID_SIZE
        });

    }

}


// =========================
// ICE
// =========================

if(objectType === "ice"){

    const alreadyExists =
        editorIce.some(object =>
            object.x === gridX &&
            object.y === gridY
        );

    if(!alreadyExists){

        editorIce.push({
            x:gridX,
            y:gridY,
            width:GRID_SIZE,
            height:GRID_SIZE
        });

    }

}

drawEditor();
}

function deleteObjectSquare(x, y){

const gridX =
    Math.floor(x / GRID_SIZE) * GRID_SIZE;

const gridY =
    Math.floor(y / GRID_SIZE) * GRID_SIZE;


editorWalls =
    editorWalls.filter(object =>
        !(
            object.x === gridX &&
            object.y === gridY
        )
    );

    editorBouncyWalls =
    editorBouncyWalls.filter(object =>
        !(
            object.x === gridX &&
            object.y === gridY
        )
    );


editorFireWalls =

editorFireWalls =
    editorFireWalls.filter(object =>
        !(
            object.x === gridX &&
            object.y === gridY
        )
    );


editorIce =
    editorIce.filter(object =>
        !(
            object.x === gridX &&
            object.y === gridY
        )
    );


drawEditor();
}

function drawEditor(){

editorCtx.clearRect(
    0,
    0,
    editorCanvas.width,
    editorCanvas.height
);

// -------------------------
// GREEN
// -------------------------

editorCtx.fillStyle = "#2f9e44";

editorCtx.fillRect(
    0,
    0,
    editorCanvas.width,
    editorCanvas.height
);

// -------------------------
// GRID
// -------------------------

const showGrid =
    document.getElementById("showGrid").checked;

if(showGrid){

    editorCtx.strokeStyle =
        "rgba(255,255,255,0.2)";

    editorCtx.lineWidth = 1;

    for(
        let x = 0;
        x <= editorCanvas.width;
        x += GRID_SIZE
    ){

        editorCtx.beginPath();

        editorCtx.moveTo(x,0);
        editorCtx.lineTo(
            x,
            editorCanvas.height
        );

        editorCtx.stroke();
    }

    for(
        let y = 0;
        y <= editorCanvas.height;
        y += GRID_SIZE
    ){

        editorCtx.beginPath();

        editorCtx.moveTo(0,y);

        editorCtx.lineTo(
            editorCanvas.width,
            y
        );

        editorCtx.stroke();
    }
}

// -------------------------
// HOLE
// -------------------------

editorCtx.fillStyle = "black";

editorCtx.beginPath();

editorCtx.arc(
    editorHole.x,
    editorHole.y,
    14,
    0,
    Math.PI * 2
);

editorCtx.fill();

// -------------------------
// START
// -------------------------

editorCtx.fillStyle = "white";

editorCtx.beginPath();

editorCtx.arc(
    editorStart.x,
    editorStart.y,
    10,
    0,
    Math.PI * 2
);

editorCtx.fill();

// -------------------------
// ICE
// -------------------------

editorCtx.fillStyle = "#bdefff";

for(const object of editorIce){

    editorCtx.fillRect(
        object.x,
        object.y,
        object.width,
        object.height
    );

}

// -------------------------
// FIRE WALLS
// -------------------------

editorCtx.fillStyle = "#ff6b35";

for(const object of editorFireWalls){

    editorCtx.fillRect(
        object.x,
        object.y,
        object.width,
        object.height
    );

}

// -------------------------
// BOUNCY WALLS
// -------------------------

editorCtx.fillStyle = "yellow";

for(const object of editorBouncyWalls){

    editorCtx.fillRect(
        object.x,
        object.y,
        object.width,
        object.height
    );

}

// -------------------------
// WALLS
// -------------------------

editorCtx.fillStyle = "#d3d3d3";
editorCtx.strokeStyle = "#999";
editorCtx.lineWidth = 2;

for(const wall of editorWalls){

    // Fill the wall
    editorCtx.fillRect(
        wall.x,
        wall.y,
        wall.width,
        wall.height
    );
}

for(const wall of editorWalls){

    const x = wall.x;
    const y = wall.y;
    const size = GRID_SIZE;

    // Check whether neighboring cells exist
    const hasTop = editorWalls.some(other =>
        other.x === x &&
        other.y === y - size
    );

    const hasBottom = editorWalls.some(other =>
        other.x === x &&
        other.y === y + size
    );

    const hasLeft = editorWalls.some(other =>
        other.x === x - size &&
        other.y === y
    );

    const hasRight = editorWalls.some(other =>
        other.x === x + size &&
        other.y === y
    );

    editorCtx.beginPath();

    // Top edge
    if(!hasTop){
        editorCtx.moveTo(x, y);
        editorCtx.lineTo(x + size, y);
    }

    // Bottom edge
    if(!hasBottom){
        editorCtx.moveTo(x, y + size);
        editorCtx.lineTo(x + size, y + size);
    }

    // Left edge
    if(!hasLeft){
        editorCtx.moveTo(x, y);
        editorCtx.lineTo(x, y + size);
    }

    // Right edge
    if(!hasRight){
        editorCtx.moveTo(x + size, y);
        editorCtx.lineTo(x + size, y + size);
    }

    editorCtx.stroke();
}
}
